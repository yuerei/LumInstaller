name: Release

# Builds the Windows app with Wails when a version tag is pushed, then attaches
# the binary to the GitHub Release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create/update the GitHub Release

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (Wails)
        run: wails build -platform windows/amd64 -clean

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # draft=true lets you review and write release notes before publishing.
          draft: true
          generate_release_notes: true
          files: build/bin/*.exe
